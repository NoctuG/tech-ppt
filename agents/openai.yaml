interface:
  display_name: "tech-ppt"
  short_description: "按课堂讲述制作卡通课件：先锁风格、再批量生图、最后组装；统一五层底版，一页一动作、全册单栏，元素层级动画单击逐层出现，无副标题及页眉页脚页码"
  default_prompt: "请使用 $tech-ppt，按本次教学设计的课堂讲述和参考风格制作课件。按固定制作流执行：先从讲述拆页，再锁定风格（style-spec落到具体色值，出封面样张与一张带真实学习材料的代表内页样张），通过后批量生成足量图片素材（主视觉、每个复现角色至少3个姿态、教学图示与元件），素材齐备后才组装。全册用统一五层底版：一张主视觉贯穿全册、正文全部落在内容板上、角色立绘只作锚点不压字；一页一个教学动作，单栏纵向，正文字号与行数按量化上限控制，放不下就拆页不缩字，无副标题、页眉、页脚、页码；给页面文字等元素加层级动画，按讲述顺序逐层出现、单击触发、不一屏全显，答案后置，禁止自动播放；输出要求的整图或可编辑PPT。"
